services:
  mongo:
    image: mongo:7
    container_name: team_calendar_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  mongo-express:
    image: mongo-express
    container_name: team_calendar_mongo_express
    ports:
      - "8090:8081"
    environment:
      ME_CONFIG_MONGODB_SERVER: mongo
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      - mongo
    restart: unless-stopped

  server:
    build: ./calendar-backend
    container_name: team_calendar_server
    ports:
      - "5000:5000"
    env_file:
      - ./calendar-backend/.env
    depends_on:
      - mongo
    restart: unless-stopped

volumes:
  mongo_data:
